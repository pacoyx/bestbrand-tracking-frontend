<div class="container-trackpedidos">
  <div
    style="
      display: flex;
      justify-content: space-between;
      border: 1px solid gainsboro;
      border-radius: 5px;
      padding: 5px;
      margin-bottom: 5px;
    "
  >
    <div style="display: flex; gap: 5px; align-items: center">
      <mat-icon>location_on</mat-icon>
      <label><strong>Tracking Map</strong></label>
    </div>
  </div>

  <div style="display: flex">
    <div style="width: 20%; padding: 10px; padding-top: 0px; padding-left: 0px">
      <div style="margin: 5px;">
        <label for="fechaSeleccionada">Fecha de Selección:</label>
        <input type="date" [(ngModel)]="fechaSeleccionada"  id="fechaSeleccionada"/>
      </div>

      @for(pedido of listPedidos; track pedido){
      <mat-card
        class="example-card"
        appearance="outlined"
        [class.selected-card]="isConductorSelected(pedido)"
      >
        <mat-card-header>
          <mat-card-title-group>
            <mat-card-title>
              <div style="display: flex; align-items: center">
                @if(isConductorSelected(pedido)){
                <mat-icon style="color: #2196f3; font-size: 20px">
                  check_circle
                </mat-icon>
                }
                <span>{{ pedido.nombreConductor }}</span>
              </div>
            </mat-card-title>
            <!-- <mat-card-subtitle>
              Pedido N°: {{ pedido.pedidoInfo }} 
            </mat-card-subtitle> -->
          </mat-card-title-group>
        </mat-card-header>
        <mat-card-content>
          <hr />
          <div style="display: flex; flex-direction: column; gap: 5px">
            <div
              style="
                width: 100%;
                border: 1px solid gainsboro;
                border-radius: 5px;
                padding: 5px;
                text-align: center;
              "
            >
              Pedidos:
            </div>

            <table>
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Número</th>
                </tr>
              </thead>
              <tbody>
                @for (item of pedido.pedidoInfo; track $index) {
                <tr
                  (click)="handlerListPedido(pedido.conductorId, item)"
                  class="fila"
                >
                  <td>{{ $index + 1 }}</td>
                  <td>{{ item.numeroPedido }}</td>
                </tr>
                }
              </tbody>
            </table>
          </div>
        </mat-card-content>
      </mat-card>
      }
    </div>

    <div style="width: 80%">
      @if(loading){
      <div
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          height: 400px;
        "
      >
        <app-loading [diameter]="40"></app-loading>
        <span style="margin-left: 16px">Cargando mapa...</span>
      </div>
      }@else{
      <app-leaflet-map
        [latitude]="xLatitud"
        [longitude]="yLongitud"
        [propiedades]="xpropiedades"
        [coordenadas]="xcoordenadas"
      ></app-leaflet-map>
      }
    </div>
  </div>
</div>
